<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Batalha Naval - Posição Matriz (Acessível)</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            transition: align-items 0.3s ease;
        }

        body.in-game {
            align-items: flex-start;
        }

        #game-container {
            text-align: center;
            width: 100%;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #instrucoes {
            max-width: 560px;
            margin: 0 auto 20px;
            font-size: 15px;
            color: #333;
            line-height: 1.4;
        }

        #aviso-acessibilidade {
            max-width: 560px;
            margin: 0 auto 20px;
            padding: 14px 16px;
            border: 3px solid #005fcc;
            border-radius: 8px;
            background-color: #e8f1ff;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.5;
            text-align: left;
        }

        #ouvirInstrucoes {
            display: block;
            margin: 0 auto 20px;
            background-color: #198754;
        }

        #ouvirInstrucoes:hover:not(:disabled) {
            background-color: #146c43;
        }

        #modoSelecao {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            margin: 20px auto 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        #modoSelecao p {
            font-weight: bold;
            margin-bottom: 14px;
        }

        .modo-btns {
            display: flex;
            gap: 10px;
        }

        .modo-btns button {
            flex: 1;
        }

        #config {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            margin: 20px auto 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: none;
        }

        #config label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #tamanho,
        #qtdBarcos {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }

        #modoVoltar {
            background-color: transparent;
            color: #007BFF;
            padding: 8px 0;
            font-size: 14px;
            text-decoration: underline;
        }

        #modoVoltar:hover {
            background-color: transparent;
            color: #0056b3;
        }

        #players {
            display: none;
            justify-content: center;
            align-items: flex-start;
            gap: 80px;
            margin-top: 20px;
        }

        body.in-game #players {
            justify-content: space-between;
            width: 100%;
            padding: 0 60px;
            gap: 20px;
        }

        .player {
            text-align: center;
            flex: 1;
        }

        .player h2 {
            margin-bottom: 10px;
        }

        .status {
            min-height: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        .controle {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .formato-ajuda {
            font-size: 13px;
            color: #555;
            margin-bottom: 16px;
        }

        .controle input {
            padding: 10px;
            width: 140px;
            font-size: 16px;
        }

        .board {
            display: grid;
            gap: 4px;
            margin: 0 auto;
            opacity: 0;
        }

        .board.fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: #007BFF;
            border: 1px solid #000;
            cursor: default;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: white;
            font-weight: bold;
        }

        .cell.ship {
            background-color: #28a745;
        }

        .cell.hit {
            background-color: #dc3545;
        }

        .cell.miss {
            background-color: #6c757d;
        }

        #reiniciar {
            display: none;
            margin-bottom: 10px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {

            #players,
            body.in-game #players {
                flex-direction: column;
                align-items: center;
                gap: 40px;
                padding: 0;
            }

            .player {
                width: 100%;
            }
        }
    </style>
</head>

<body aria-describedby="instrucoes aviso-acessibilidade">

    <div id="game-container">

        <h1>⚓ Batalha das Matrizes</h1>

        <button id="ouvirInstrucoes" type="button" onclick="lerInstrucoes()" aria-label="Jogo Naval narrado">
            !Aviso!
        </button>

        <button id="ouvirInstrucoes" type="button" onclick="lerInstrucoes()" aria-label="Use a tecla Tab para navegar entre as opções e os campos. Use Enter para selecionar ou confirmar uma opção. As instruções e os resultados também são anunciados por voz quando o recurso estiver disponível, aperte tab para escolher como quer jogar">
            🔊 Ouvir instruções
        </button>

        <button onclick="reiniciarJogo()" id="reiniciar" aria-label="Reiniciar o jogo">Reiniciar</button>

        <div id="modoSelecao">
            <p>Como você quer jogar?</p>
            <div class="modo-btns">
                <button onclick="escolherModo('pvp')" aria-label="Escolher modo pessoa contra pessoa">👥 Pessoa vs Pessoa</button>
                <button onclick="escolherModo('pve')" aria-label="Escolher modo pessoa contra computador">🤖 Pessoa vs Computador</button>
            </div>
        </div>

        <div id="config">

            <button id="modoVoltar" onclick="voltarParaModo()" aria-label="Voltar e trocar o modo de jogo">← Trocar modo de jogo</button>

            <label for="tamanho">
                Escolha o tamanho do tabuleiro (ex: 5x5, de 1x1 a 10x10):
            </label>

            <input type="text" id="tamanho" placeholder="Ex: 5x5" maxlength="5" aria-describedby="ajuda-tamanho" aria-label="Escolher tamanho do tabuleiro, por exemplo 5x5">
            <p id="ajuda-tamanho" class="sr-only">Digite linhas vezes colunas, por exemplo 5x5. São permitidos valores de 1x1 até 10x10.</p>

            <label for="qtdBarcos">
                Quantidade de barcos por jogador (máximo 5):
            </label>

            <input type="number" id="qtdBarcos" placeholder="Ex: 3" min="1" max="5" aria-describedby="ajuda-barcos" aria-label="Escolher a quantidade de barcos, de 1 a 5">
            <p id="ajuda-barcos" class="sr-only">Digite um número inteiro entre 1 e 5.</p>

            <button onclick="iniciarJogo()" aria-label="Começar o jogo">
                Começar Jogo
            </button>

        </div>

        <div id="players">

            <div class="player">
                <h2 id="tituloJogador1">🚢 Jogador 1</h2>
                <p class="status" id="status1" role="status" aria-live="polite" aria-atomic="true"></p>
                <div class="controle">
                    <label for="input1" class="sr-only">Posição, formato linha espaço coluna</label>
                    <input type="text" id="input1" placeholder="Ex: 1 2" maxlength="6" disabled>
                    <button id="acao1" onclick="submitAction(1)" disabled aria-label="Ação do Jogador 1">Aguarde...</button>
                </div>
                <p class="formato-ajuda">Digite: linha coluna (ex: 1 2)</p>
                <div id="board1" class="board" role="group" aria-label="Tabuleiro do Jogador 1"></div>
            </div>

            <div class="player">
                <h2 id="tituloJogador2">🚢 Jogador 2</h2>
                <p class="status" id="status2" role="status" aria-live="polite" aria-atomic="true"></p>
                <div class="controle" id="controle2">
                    <label for="input2" class="sr-only">Posição, formato linha espaço coluna</label>
                    <input type="text" id="input2" placeholder="Ex: 1 2" maxlength="6" disabled>
                    <button id="acao2" onclick="submitAction(2)" disabled aria-label="Ação do Jogador 2">Aguarde...</button>
                </div>
                <p class="formato-ajuda" id="ajuda2">Digite: linha coluna (ex: 1 2)</p>
                <div id="board2" class="board" role="group" aria-label="Tabuleiro do Jogador 2"></div>
            </div>
        </div>

        <div id="anuncios" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script>
        // ---------------------------------------------------------------
        // Definição dos tipos de matriz usados pelo computador (modo PvE)
        // para calcular onde posicionar os próprios navios.
        // Cada tipo define quais células (linha, coluna) são "candidatas"
        // e uma condição de validade em função do formato do tabuleiro.
        // ---------------------------------------------------------------
        const TIPOS_MATRIZ = [
            {
                id: "quadrada",
                nome: "1 - Matriz quadrada",
                ajuda: "Só disponível em tabuleiros com o mesmo número de linhas e colunas. O computador pode usar qualquer célula do tabuleiro.",
                valido: (r, c) => r === c,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "retangular",
                nome: "2 - Matriz retangular",
                ajuda: "Só disponível quando o número de linhas é diferente do número de colunas.",
                valido: (r, c) => r !== c,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "nula",
                nome: "3 - Matriz nula (matriz zero)",
                ajuda: "Uma matriz nula não tem nenhuma posição marcada, então o computador sorteia os navios livremente entre as células vazias.",
                valido: () => true,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "coluna",
                nome: "4 - Matriz coluna",
                ajuda: "Só disponível em tabuleiros com apenas 1 coluna.",
                valido: (r, c) => c === 1,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "linha",
                nome: "5 - Matriz linha",
                ajuda: "Só disponível em tabuleiros com apenas 1 linha.",
                valido: (r, c) => r === 1,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "diagonal",
                nome: "6 - Matriz diagonal",
                ajuda: "O computador prioriza as células da diagonal principal (linha = coluna).",
                valido: () => true,
                candidatos: (r, c) => diagonalPrincipal(r, c)
            },
            {
                id: "escalar",
                nome: "7 - Matriz escalar",
                ajuda: "Como a matriz diagonal, mas com o mesmo 'valor' repetido — o computador usa as posições da diagonal principal.",
                valido: () => true,
                candidatos: (r, c) => diagonalPrincipal(r, c)
            },
            {
                id: "identidade",
                nome: "8 - Matriz identidade",
                ajuda: "Só disponível em tabuleiros quadrados. O computador usa as posições da diagonal principal.",
                valido: (r, c) => r === c,
                candidatos: (r, c) => diagonalPrincipal(r, c)
            },
            {
                id: "unidade",
                nome: "9 - Matriz unidade (matriz de 1s)",
                ajuda: "Todas as posições valem 1, então o computador pode usar qualquer célula do tabuleiro.",
                valido: () => true,
                candidatos: (r, c) => todasCelulas(r, c)
            },
            {
                id: "triSuperior",
                nome: "10 - Matriz triangular superior",
                ajuda: "O computador usa apenas as células em que a coluna é maior ou igual à linha.",
                valido: () => true,
                candidatos: (r, c) => filtrarCelulas(r, c, (l, k) => k >= l)
            },
            {
                id: "triInferior",
                nome: "11 - Matriz triangular inferior",
                ajuda: "O computador usa apenas as células em que a coluna é menor ou igual à linha.",
                valido: () => true,
                candidatos: (r, c) => filtrarCelulas(r, c, (l, k) => k <= l)
            },
            {
                id: "transposta",
                nome: "12 - Matriz transposta",
                ajuda: "O computador sorteia posições e reflete cada uma na posição espelhada (linha e coluna trocadas).",
                valido: () => true,
                candidatos: (r, c) => todasCelulas(r, c),
                espelhar: true
            },
            {
                id: "simetrica",
                nome: "13 - Matriz simétrica",
                ajuda: "Só disponível em tabuleiros quadrados. As posições escolhidas são espelhadas em relação à diagonal principal.",
                valido: (r, c) => r === c,
                candidatos: (r, c) => todasCelulas(r, c),
                espelhar: true
            },
            {
                id: "antissimetrica",
                nome: "14 - Matriz antissimétrica",
                ajuda: "Só disponível em tabuleiros quadrados. A diagonal principal fica de fora (numa antissimétrica ela é sempre zero) e as posições são espelhadas fora da diagonal.",
                valido: (r, c) => r === c,
                candidatos: (r, c) => filtrarCelulas(r, c, (l, k) => l !== k),
                espelhar: true
            },
            {
                id: "normal",
                nome: "15 - Matriz normal",
                ajuda: "Só disponível em tabuleiros quadrados. O computador combina a diagonal principal com posições espelhadas, um caso comum de matriz normal.",
                valido: (r, c) => r === c,
                candidatos: (r, c) => todasCelulas(r, c),
                espelhar: true
            }
        ];

        function todasCelulas(rows, cols) {
            const lista = [];
            for (let l = 1; l <= rows; l++)
                for (let c = 1; c <= cols; c++) lista.push({ linha: l, coluna: c });
            return lista;
        }

        function diagonalPrincipal(rows, cols) {
            const lista = [];
            const n = Math.min(rows, cols);
            for (let i = 1; i <= n; i++) lista.push({ linha: i, coluna: i });
            return lista;
        }

        function filtrarCelulas(rows, cols, condicao) {
            return todasCelulas(rows, cols).filter(p => condicao(p.linha, p.coluna));
        }

        function embaralhar(lista) {
            const arr = lista.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Gera o conjunto de posições (chaves "linha-coluna") que o
        // computador vai usar para os próprios navios, a partir do tipo de
        // matriz escolhido.
        function gerarPosicoesIA(tipoId, rows, cols, shipsCount) {
            const tipo = TIPOS_MATRIZ.find(t => t.id === tipoId) || TIPOS_MATRIZ[8];
            const posicoes = new Set();

            const candidatosBase = embaralhar(tipo.candidatos(rows, cols));

            for (const p of candidatosBase) {
                if (posicoes.size >= shipsCount) break;
                const chave = `${p.linha}-${p.coluna}`;
                if (posicoes.has(chave)) continue;
                posicoes.add(chave);

                if (tipo.espelhar) {
                    const espelhada = { linha: p.coluna, coluna: p.linha };
                    if (coordenadaValida(espelhada.linha, espelhada.coluna, rows, cols)) {
                        const chaveEsp = `${espelhada.linha}-${espelhada.coluna}`;
                        if (posicoes.size < shipsCount) posicoes.add(chaveEsp);
                    }
                }
            }

            // Se o padrão não gerou navios suficientes (ex.: diagonal de
            // tabuleiro pequeno), completa com posições aleatórias restantes.
            if (posicoes.size < shipsCount) {
                const restantes = embaralhar(todasCelulas(rows, cols).filter(p => !posicoes.has(`${p.linha}-${p.coluna}`)));
                for (const p of restantes) {
                    if (posicoes.size >= shipsCount) break;
                    posicoes.add(`${p.linha}-${p.coluna}`);
                }
            }

            return posicoes;
        }

        // Escolhe, ao acaso, um tipo de matriz válido para o formato do
        // tabuleiro atual. É assim que o computador decide sozinho como vai
        // calcular a posição dos próprios navios, sem que o jogador escolha
        // ou veja qual tipo foi usado antes do fim do jogo.
        function escolherTipoMatrizAleatorio(rows, cols) {
            const validos = TIPOS_MATRIZ.filter(t => t.valido(rows, cols));
            const lista = validos.length > 0 ? validos : TIPOS_MATRIZ.filter(t => t.id === "unidade");
            return lista[Math.floor(Math.random() * lista.length)];
        }

        // ---------------------------------------------------------------
        // Estado do jogo
        // ---------------------------------------------------------------
        let config = { rows: 0, cols: 0, shipsCount: 0, estrategiaIA: "unidade" };
        let modoJogo = null; // 'pvp' | 'pve'
        let phase = "modo";
        let turn = 1;

        let ships1 = new Set();
        let ships2 = new Set();
        let attacked1 = new Map();
        let attacked2 = new Map();
        let filaAlvosIA = [];

        function falar(texto) {
            const anuncios = document.getElementById("anuncios");
            if (anuncios) anuncios.textContent = texto;
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();
                const utter = new SpeechSynthesisUtterance(texto);
                utter.lang = "pt-BR";
                utter.rate = 0.95;
                const vozes = window.speechSynthesis.getVoices();
                const vozPortugues = vozes.find(voz => voz.lang.toLowerCase().startsWith("pt"));
                if (vozPortugues) utter.voice = vozPortugues;
                // Fala imediatamente, mantendo a chamada dentro do evento do Tab.
                window.speechSynthesis.speak(utter);
            } catch (e) {
                // síntese de voz indisponível, seguimos apenas com texto/aria-live
            }
        }

        function textoDasInstrucoesIniciais() {
            const instrucoes = document.getElementById("instrucoes");
            return [
                "Use a tecla Tab para navegar entre as opções e os campos. Use Enter para selecionar ou confirmar uma opção. As instruções e os resultados também são anunciados por voz quando o recurso estiver disponível.",
                "Instruções iniciais do jogo.",
                instrucoes ? instrucoes.textContent.trim() : "",
                "Escolha um botão para começar."
            ].filter(Boolean).join(" ");
        }

        function lerInstrucoes() {
            falar(textoDasInstrucoesIniciais());
        }

        function escolherModo(modo) {
            modoJogo = modo;
            document.getElementById("modoSelecao").style.display = "none";
            document.getElementById("config").style.display = "block";
            phase = "config";

            if (modo === "pve") {
                falar("Modo pessoa contra computador selecionado. Configure o tabuleiro e a estratégia do computador.");
            } else {
                falar("Modo pessoa contra pessoa selecionado. Configure o tabuleiro.");
            }
        }

        function voltarParaModo() {
            document.getElementById("config").style.display = "none";
            document.getElementById("modoSelecao").style.display = "block";
            modoJogo = null;
            phase = "modo";
        }

        function iniciarJogo() {

            const tamanhoInput = document.getElementById("tamanho").value.trim();
            const qtdInput = document.getElementById("qtdBarcos").value.trim();

            const regexTamanho = /^([1-9]|10)x([1-9]|10)$/i;
            if (!regexTamanho.test(tamanhoInput)) {
                alert("Tamanho inválido! Use o formato LxC (linhas x colunas), com valores entre 1 e 10. Ex: 5x5.");
                return;
            }

            const [linhas, colunas] = tamanhoInput.toLowerCase().split("x").map(Number);

            if (linhas < 1 || linhas > 10 || colunas < 1 || colunas > 10) {
                alert("O tabuleiro deve ter no mínimo 1x1 e no máximo 10x10.");
                return;
            }

            const qtdBarcos = parseInt(qtdInput, 10);
            if (isNaN(qtdBarcos) || qtdBarcos < 1 || qtdBarcos > 5) {
                alert("A quantidade de barcos deve ser um número inteiro entre 1 e 5.");
                return;
            }

            if (qtdBarcos > linhas * colunas) {
                alert("A quantidade de barcos não pode ser maior que o número de células do tabuleiro.");
                return;
            }

            config.rows = linhas;
            config.cols = colunas;
            config.shipsCount = qtdBarcos;

            config.estrategiaIA = null; // será sorteado pelo computador ao terminar o Jogador 1

            ships1 = new Set();
            ships2 = new Set();
            attacked1 = new Map();
            attacked2 = new Map();
            filaAlvosIA = [];
            turn = 1;

            document.getElementById("config").style.display = "none";
            document.getElementById("players").style.display = "flex";
            document.getElementById("reiniciar").style.display = "inline-block";
            document.body.classList.add("in-game");

            document.getElementById("tituloJogador1").textContent = "🚢 Jogador 1";
            document.getElementById("tituloJogador2").textContent = modoJogo === "pve" ? "🤖 Computador" : "🚢 Jogador 2";

            const controle2 = document.getElementById("controle2");
            const ajuda2 = document.getElementById("ajuda2");
            controle2.style.display = modoJogo === "pve" ? "none" : "flex";
            ajuda2.style.display = modoJogo === "pve" ? "none" : "block";

            const board1 = document.getElementById("board1");
            const board2 = document.getElementById("board2");

            board1.innerHTML = "";
            board2.innerHTML = "";
            board1.classList.remove("fade-in");
            board2.classList.remove("fade-in");

            board1.style.gridTemplateColumns = `repeat(${colunas}, 40px)`;
            board2.style.gridTemplateColumns = `repeat(${colunas}, 40px)`;

            criarTabuleiro(board1, linhas, colunas);
            criarTabuleiro(board2, linhas, colunas);

            void board1.offsetWidth;
            void board2.offsetWidth;
            board1.classList.add("fade-in");
            board2.classList.add("fade-in");

            phase = "placement1";
            atualizarStatus();
            document.getElementById("input1").focus();

            if (modoJogo === "pve") {
                falar(`Tabuleiro de ${linhas} linhas por ${colunas} colunas criado. Digite a posição do seu primeiro barco no formato linha espaço coluna. O computador vai calcular a posição dele depois, usando um tipo de matriz sorteado.`);
            } else {
                falar(`Tabuleiro de ${linhas} linhas por ${colunas} colunas criado. Jogador 1, digite a posição do seu primeiro barco no formato linha espaço coluna. Seus navios ficarão ocultos do Jogador 2 assim que você terminar de posicionar.`);
            }
        }

        function criarTabuleiro(board, rows, cols) {
            for (let linha = 1; linha <= rows; linha++) {
                for (let coluna = 1; coluna <= cols; coluna++) {

                    const celula = document.createElement("div");
                    celula.classList.add("cell");

                    const chave = `${linha}-${coluna}`;
                    celula.dataset.posicao = chave;
                    celula.dataset.linha = linha;
                    celula.dataset.coluna = coluna;
                    celula.tabIndex = 0;

                    atualizarDescricaoCelula(celula, "vazio");

                    board.appendChild(celula);
                }
            }
        }

        function atualizarDescricaoCelula(celula, estado) {
            const linha = celula.dataset.linha;
            const coluna = celula.dataset.coluna;
            const texto = `Linha ${linha}, coluna ${coluna}: ${estado}`;
            celula.title = texto;
            celula.setAttribute("aria-label", texto);
        }

        // Remove a marcação visual "ship" de um tabuleiro, sem apagar os
        // dados internos (ships1/ships2). Usado para ocultar os navios
        // assim que um jogador termina de posicionar, evitando que o
        // adversário veja as posições olhando para a mesma tela.
        function ocultarNavios(boardEl) {
            boardEl.querySelectorAll(".cell.ship").forEach(cell => {
                cell.classList.remove("ship");
                if (!cell.classList.contains("hit") && !cell.classList.contains("miss")) {
                    atualizarDescricaoCelula(cell, "oculto");
                }
            });
        }

        function parsePosicao(texto) {
            if (!texto) return null;
            const partes = texto.trim().split(/[\s,]+/);
            if (partes.length !== 2) return null;

            const linha = parseInt(partes[0], 10);
            const coluna = parseInt(partes[1], 10);

            if (isNaN(linha) || isNaN(coluna)) return null;
            return { linha, coluna };
        }

        function coordenadaValida(linha, coluna, rows, cols) {
            return linha >= 1 && linha <= rows && coluna >= 1 && coluna <= cols;
        }

        function submitAction(playerNum) {
            const inputEl = document.getElementById(`input${playerNum}`);
            const texto = inputEl.value.trim();

            if (!texto) {
                alert("Digite uma posição no formato linha espaço coluna, por exemplo: 1 2.");
                falar("Digite uma posição no formato linha espaço coluna. Por exemplo: 1 2.");
                return;
            }

            if ((playerNum === 1 && phase === "placement1") || (playerNum === 2 && phase === "placement2")) {
                const sucesso = togglePosicionamento(playerNum, texto);
                if (sucesso) inputEl.value = "";
            } else if (phase === "battle" && turn === playerNum) {
                const sucesso = atacar(playerNum, texto);
                if (sucesso) inputEl.value = "";
            } else {
                alert("Ação não disponível neste momento.");
            }

            inputEl.focus();
        }

        function togglePosicionamento(playerNum, texto) {
            const rows = config.rows, cols = config.cols;
            const pos = parsePosicao(texto);

            if (!pos || !coordenadaValida(pos.linha, pos.coluna, rows, cols)) {
                const msg = `Posição inválida! Digite linha entre 1 e ${rows}, espaço, coluna entre 1 e ${cols}. Exemplo: 1 2.`;
                alert(msg);
                falar(msg);
                return false;
            }

            const chave = `${pos.linha}-${pos.coluna}`;
            const ships = playerNum === 1 ? ships1 : ships2;
            const boardEl = document.getElementById(playerNum === 1 ? "board1" : "board2");
            const cell = boardEl.querySelector(`[data-posicao="${chave}"]`);

            if (ships.has(chave)) {
                ships.delete(chave);
                cell.classList.remove("ship");
                atualizarDescricaoCelula(cell, "vazio");
                // A posição não é narrada por voz, para não revelar o navio a quem estiver ouvindo.
                falar(`Barco removido. ${ships.size} de ${config.shipsCount} posicionados.`);
            } else {
                if (ships.size >= config.shipsCount) {
                    const msg = `Você já posicionou todos os ${config.shipsCount} barcos. Digite a posição de um barco já colocado para removê-lo, se quiser trocar.`;
                    alert(msg);
                    falar(msg);
                    return false;
                }
                ships.add(chave);
                cell.classList.add("ship");
                atualizarDescricaoCelula(cell, "com navio");
                // A posição não é narrada por voz, para não revelar o navio a quem estiver ouvindo.
                falar(`Barco posicionado. ${ships.size} de ${config.shipsCount}.`);
            }

            if (ships.size === config.shipsCount) {
                if (playerNum === 1) {
                    if (modoJogo === "pve") {
                        prepararComputadorEIniciarBatalha();
                    } else {
                        // Oculta os navios do Jogador 1 antes de passar a tela
                        // para o Jogador 2, para que ele não veja as posições.
                        ocultarNavios(boardEl);
                        phase = "placement2";
                        atualizarStatus();
                        alert("Jogador 1 posicionou todos os barcos! Seus navios foram ocultados. Agora é a vez do Jogador 2 posicionar os seus.");
                        falar("Jogador 1 posicionou todos os barcos e eles foram ocultados. Agora é a vez do Jogador 2.");
                        document.getElementById("input2").focus();
                    }
                } else {
                    // Jogador 2 (humano, modo PvP) terminou: oculta os navios
                    // dele também antes da batalha começar.
                    ocultarNavios(boardEl);
                    iniciarBatalha();
                }
            } else {
                atualizarStatus();
            }

            return true;
        }

        // No modo PvE, o computador calcula sozinho a posição dos seus
        // navios a partir do tipo de matriz escolhido na configuração. As
        // posições nunca recebem a classe visual "ship", então o jogador
        // humano não pode ver onde os navios do computador estão.
        function prepararComputadorEIniciarBatalha() {
            const tipoEscolhido = escolherTipoMatrizAleatorio(config.rows, config.cols);
            config.estrategiaIA = tipoEscolhido.id;
            ships2 = gerarPosicoesIA(config.estrategiaIA, config.rows, config.cols, config.shipsCount);
            falar(`O computador calculou a posição dos navios usando ${tipoEscolhido.nome}.`);
            iniciarBatalha();
        }

        function iniciarBatalha() {
            phase = "battle";
            turn = 1;
            atualizarStatus();
            const msg = modoJogo === "pve"
                ? "Todos os navios foram posicionados! A batalha começa agora. É a sua vez de atacar."
                : "Todos os barcos foram posicionados! A batalha começa agora. Vez do Jogador 1 atacar.";
            alert(msg);
            falar(msg);
            document.getElementById("input1").focus();
        }

        function atacar(playerNum, texto) {
            const rows = config.rows, cols = config.cols;
            const pos = parsePosicao(texto);

            if (!pos || !coordenadaValida(pos.linha, pos.coluna, rows, cols)) {
                const msg = `Posição inválida! Digite linha entre 1 e ${rows}, espaço, coluna entre 1 e ${cols}. Exemplo: 1 2.`;
                alert(msg);
                falar(msg);
                return false;
            }

            const chave = `${pos.linha}-${pos.coluna}`;
            const targetBoardId = playerNum === 1 ? "board2" : "board1";
            const targetShips = playerNum === 1 ? ships2 : ships1;
            const attackedMap = playerNum === 1 ? attacked2 : attacked1;

            if (attackedMap.has(chave)) {
                if (playerNum === 2) return false; // computador tenta outra posição silenciosamente
                const msg = "Você já atacou essa posição! Escolha outra.";
                alert(msg);
                falar(msg);
                return false;
            }

            const boardEl = document.getElementById(targetBoardId);
            const cell = boardEl.querySelector(`[data-posicao="${chave}"]`);
            const acertou = targetShips.has(chave);

            attackedMap.set(chave, acertou ? "hit" : "miss");
            cell.classList.remove("ship");
            cell.classList.add(acertou ? "hit" : "miss");
            cell.textContent = acertou ? "💥" : "•";
            atualizarDescricaoCelula(cell, acertou ? "atingido" : "água");

            const quemAtacou = playerNum === 2 && modoJogo === "pve" ? "O computador" : null;
            falar(acertou
                ? `${quemAtacou ? quemAtacou + " acertou" : "Acertou"}! Linha ${pos.linha}, coluna ${pos.coluna}.`
                : `${quemAtacou ? quemAtacou + " jogou na água" : "Água"}. Linha ${pos.linha}, coluna ${pos.coluna}.`);

            const afundados = [...targetShips].filter(p => attackedMap.get(p) === "hit").length;

            if (afundados === targetShips.size) {
                finalizarJogo(playerNum);
                return true;
            }

            turn = playerNum === 1 ? 2 : 1;
            atualizarStatus();

            if (turn === 2 && modoJogo === "pve" && phase === "battle") {
                if (acertou) {
                    [[pos.linha - 1, pos.coluna], [pos.linha + 1, pos.coluna], [pos.linha, pos.coluna - 1], [pos.linha, pos.coluna + 1]]
                        .forEach(([l, c]) => {
                            if (coordenadaValida(l, c, rows, cols) && !attacked1.has(`${l}-${c}`)) {
                                filaAlvosIA.push({ linha: l, coluna: c });
                            }
                        });
                }
                setTimeout(jogadaComputador, 900);
            } else {
                document.getElementById(`input${turn}`).focus();
            }

            return true;
        }

        // IA de ataque do computador: usa uma fila de alvos vizinhos a
        // acertos anteriores (estratégia "caça"), e sorteia aleatoriamente
        // quando não há pistas.
        function jogadaComputador() {
            if (phase !== "battle" || turn !== 2) return;

            let alvo = null;
            while (filaAlvosIA.length > 0) {
                const cand = filaAlvosIA.shift();
                const chave = `${cand.linha}-${cand.coluna}`;
                if (coordenadaValida(cand.linha, cand.coluna, config.rows, config.cols) && !attacked1.has(chave)) {
                    alvo = cand;
                    break;
                }
            }

            if (!alvo) {
                const candidatos = [];
                for (let l = 1; l <= config.rows; l++)
                    for (let c = 1; c <= config.cols; c++)
                        if (!attacked1.has(`${l}-${c}`)) candidatos.push({ linha: l, coluna: c });

                if (candidatos.length === 0) return;
                alvo = candidatos[Math.floor(Math.random() * candidatos.length)];
            }

            atacar(2, `${alvo.linha} ${alvo.coluna}`);
        }

        function finalizarJogo(vencedor) {
            phase = "gameover";
            atualizarStatus();

            const nomeVencedor = vencedor === 1 ? "Jogador 1" : (modoJogo === "pve" ? "Computador" : "Jogador 2");
            const msgVencedor = `🏆 Fim de jogo! ${nomeVencedor} venceu, afundando todos os barcos do adversário!`;
            document.getElementById("status1").textContent = vencedor === 1 ? msgVencedor : "Fim de jogo. Você perdeu.";
            document.getElementById("status2").textContent = vencedor === 2 ? msgVencedor : "Fim de jogo. Você perdeu.";

            alert(msgVencedor);
            falar(`Fim de jogo. ${nomeVencedor} venceu, afundando todos os barcos do adversário.`);
        }

        function atualizarStatus() {
            const s1 = document.getElementById("status1");
            const s2 = document.getElementById("status2");
            const b1 = document.getElementById("acao1");
            const b2 = document.getElementById("acao2");
            const i1 = document.getElementById("input1");
            const i2 = document.getElementById("input2");

            if (phase === "placement1") {
                s1.textContent = `Posicione seus barcos: ${ships1.size}/${config.shipsCount}`;
                s2.textContent = modoJogo === "pve" ? "O computador vai calcular a posição dele depois." : "Aguardando o Jogador 1 posicionar os barcos...";
                b1.textContent = "Posicionar"; b1.disabled = false; i1.disabled = false;
                b2.textContent = "Aguarde..."; b2.disabled = true; i2.disabled = true;
            } else if (phase === "placement2") {
                s1.textContent = "Barcos posicionados e ocultados! Aguardando o Jogador 2...";
                s2.textContent = `Posicione seus barcos: ${ships2.size}/${config.shipsCount}`;
                b1.textContent = "Aguarde..."; b1.disabled = true; i1.disabled = true;
                b2.textContent = "Posicionar"; b2.disabled = false; i2.disabled = false;
            } else if (phase === "battle") {
                s1.textContent = turn === 1
                    ? "🎯 Sua vez! Digite a posição (linha coluna) para atacar."
                    : (modoJogo === "pve" ? "🤖 O computador está jogando..." : "Aguarde a vez do Jogador 2...");
                s2.textContent = turn === 2
                    ? (modoJogo === "pve" ? "🤖 O computador está jogando..." : "🎯 Sua vez! Digite a posição (linha coluna) para atacar.")
                    : "Aguarde a vez do Jogador 1...";
                b1.textContent = "Atacar"; b1.disabled = turn !== 1; i1.disabled = turn !== 1;
                b2.textContent = "Atacar"; b2.disabled = turn !== 2; i2.disabled = turn !== 2;
            } else if (phase === "gameover") {
                b1.disabled = true; b2.disabled = true; i1.disabled = true; i2.disabled = true;
            }
        }

        function reiniciarJogo() {
            document.getElementById("players").style.display = "none";
            document.getElementById("config").style.display = "none";
            document.getElementById("modoSelecao").style.display = "block";
            document.getElementById("reiniciar").style.display = "none";
            document.body.classList.remove("in-game");

            const board1 = document.getElementById("board1");
            const board2 = document.getElementById("board2");

            board1.innerHTML = "";
            board2.innerHTML = "";
            board1.classList.remove("fade-in");
            board2.classList.remove("fade-in");

            document.getElementById("input1").value = "";
            document.getElementById("input2").value = "";
            document.getElementById("input1").disabled = true;
            document.getElementById("input2").disabled = true;
            document.getElementById("acao1").disabled = true;
            document.getElementById("acao2").disabled = true;
            document.getElementById("acao1").textContent = "Aguarde...";
            document.getElementById("acao2").textContent = "Aguarde...";
            document.getElementById("status1").textContent = "";
            document.getElementById("status2").textContent = "";
            document.getElementById("controle2").style.display = "flex";
            document.getElementById("ajuda2").style.display = "block";

            document.getElementById("tamanho").value = "";
            document.getElementById("qtdBarcos").value = "";

            config = { rows: 0, cols: 0, shipsCount: 0, estrategiaIA: "unidade" };
            modoJogo = null;
            phase = "modo";
            turn = 1;
            ships1 = new Set();
            ships2 = new Set();
            attacked1 = new Map();
            attacked2 = new Map();
            filaAlvosIA = [];
        }

        // permite pressionar Enter nos campos de posição
        document.getElementById("input1").addEventListener("keypress", function (e) {
            if (e.key === "Enter") submitAction(1);
        });
        document.getElementById("input2").addEventListener("keypress", function (e) {
            if (e.key === "Enter") submitAction(2);
        });

        // Relembra a navegação acessível sempre que o site é aberto.
        window.addEventListener("load", function () {
            // Tenta falar automaticamente ao abrir a página.
            setTimeout(lerInstrucoes, 250);
            const instrucoes = document.getElementById("instrucoes");
            if (instrucoes) instrucoes.focus();
        });

        // Alguns navegadores bloqueiam voz automática. O primeiro Tab libera
        // a leitura sem exigir que a pessoa enxergue.
        let leituraInicialLiberada = false;
        function liberarLeituraInicial() {
            if (leituraInicialLiberada) return;
            leituraInicialLiberada = true;
            lerInstrucoes();
        }
        document.addEventListener("keydown", function (evento) {
            if (evento.key === "Tab") {
                liberarLeituraInicial();
            }
        }, true);

        // Anuncia o nome e a função de cada botão ao receber foco e ao ser acionado.
        // Isso ajuda quem navega somente pelo teclado ou usa leitor de tela.
        document.querySelectorAll("button").forEach(function (botao) {
            botao.addEventListener("focus", function () {
                const nome = botao.getAttribute("aria-label") || botao.textContent.trim();
                falar(botao.disabled ? `${nome}. Botão desabilitado.` : `${nome}. Botão.`);
            });
            botao.addEventListener("click", function () {
                const nome = botao.getAttribute("aria-label") || botao.textContent.trim();
                if (!botao.disabled) falar(`${nome}.`);
            });
        });

        
        // Ao passar pelo segundo botão de aviso, oculta os dois botões.
        const botoesDeAviso = document.querySelectorAll("#ouvirInstrucoes");
        if (botoesDeAviso.length > 1) {
            const ocultarBotoesDeAviso = function () {
                botoesDeAviso.forEach(function (botao) {
                    botao.style.display = "none";
                });
            };
            botoesDeAviso[1].addEventListener("focus", ocultarBotoesDeAviso, { once: true });
            botoesDeAviso[1].addEventListener("mouseenter", ocultarBotoesDeAviso, { once: true });
        }
         </script>
